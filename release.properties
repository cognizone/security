# =============================================================================
# Release configuration for security
# Read by release.sh to configure the build/publish pipeline.
# =============================================================================

# Java version for the build container (11, 17, 21)
java.version=17

# Default branch for GitVersion computation
default.branch=main

# Where to publish: internal | mavencentral | both
publish.target=both

# Skip frontend build during release (no frontend in this repo)
skip.frontend=false

# Extra Gradle properties (space-separated, passed as-is to ./gradlew)
extra.gradle.properties=
